name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish, for example v4.0.0
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  package:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.10.3
          arch: win64_msvc2022_64
          modules: qtimageformats qtshadertools
      - name: Configure
        run: cmake -S . -B build/intermediate/ci -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
      - name: Build
        run: cmake --build build/intermediate/ci --config Release --target QuickImageView qiv_controller_tests qiv_qml_tests
      - name: Test
        run: ctest --test-dir build/intermediate/ci -C Release --output-on-failure
      - name: Deploy Qt runtime
        shell: pwsh
        run: |
          $env:PYTHONIOENCODING = "utf-8"
          python .\scripts\deploy.py
          if ($LASTEXITCODE -ne 0) { throw "Qt deploy failed" }
      - name: Assemble package
        shell: pwsh
        run: |
          $zip = Join-Path $env:GITHUB_WORKSPACE "QuickImageView-binary.zip"
          pwsh -NoProfile -ExecutionPolicy Bypass -File .\scripts\package.ps1 -OutputDirectory .\build\intermediate\package -ArchivePath $zip
          $required = @(
            ".\build\intermediate\package\QuickImageView.exe",
            ".\build\intermediate\package\Qt6Core.dll",
            ".\build\intermediate\package\platforms\qwindows.dll",
            ".\build\intermediate\package\readme.txt",
            ".\build\intermediate\package\readme_jp.txt",
            ".\build\intermediate\package\LICENSE.txt"
          )
          foreach ($file in $required) {
            if (!(Test-Path -LiteralPath $file)) { throw "Missing distribution file: $file" }
          }
      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $zipName = "QuickImageView-binary.zip"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zipName).Hash.ToUpper()
          "$hash  $zipName" | Set-Content -Path SHA256SUMS.txt -Encoding utf8NoBOM
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          files: |
            QuickImageView-binary.zip
            SHA256SUMS.txt
          overwrite_files: true
          generate_release_notes: true
          body: |
            QuickImageView (Qt Quick) ${{ env.RELEASE_TAG }}

            Download `QuickImageView-binary.zip`, extract every file into the same folder, and run `QuickImageView.exe`. Verify the download against `SHA256SUMS.txt`.

            Keep the executable, Qt DLLs, `platforms`, `imageformats`, and `qml` together.
