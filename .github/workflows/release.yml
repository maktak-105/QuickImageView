name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish, for example v4.0.0
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  package:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Install Qt 6 and MinGW
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.10.3
          arch: win64_mingw
          tools: tools_mingw1310,qt.tools.win64_mingw1310
          modules: qtimageformats qtshadertools
      - name: Build, test and deploy
        shell: pwsh
        run: |
          $env:PYTHONIOENCODING = "utf-8"
          # Same script as the local build: CMake with MinGW Makefiles, CTest, then the Qt runtime deployment.
          $env:QT_ROOT = $env:QT_ROOT_DIR
          $env:QT_MINGW_BIN = Join-Path (Split-Path (Split-Path $env:QT_ROOT_DIR)) 'Tools\mingw1310_64\bin'
          python .\scripts\build.py
          if ($LASTEXITCODE -ne 0) { throw "Build failed" }
      - name: Assemble package
        shell: pwsh
        run: |
          $zip = Join-Path $env:GITHUB_WORKSPACE "QuickImageView-binary.zip"
          pwsh -NoProfile -ExecutionPolicy Bypass -File .\scripts\package.ps1 -OutputDirectory .\build\intermediate\package -ArchivePath $zip
          if ($LASTEXITCODE -ne 0) { throw "Packaging failed" }
          pwsh -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify_package.ps1 -PackageDirectory .\build\intermediate\package
          if ($LASTEXITCODE -ne 0) { throw "Package verification failed" }
      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $zipName = "QuickImageView-binary.zip"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zipName).Hash.ToUpper()
          "$hash  $zipName" | Set-Content -Path SHA256SUMS.txt -Encoding utf8NoBOM
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          files: |
            QuickImageView-binary.zip
            SHA256SUMS.txt
          overwrite_files: true
          generate_release_notes: true
          body: |
            QuickImageView (Qt Quick) ${{ env.RELEASE_TAG }}

            Download `QuickImageView-binary.zip`, extract every file into the same folder, and run `QuickImageView.exe`. Verify the download against `SHA256SUMS.txt`.

            Keep the executable, Qt DLLs, `platforms`, `imageformats`, and `qml` together.
