name: Release

on:
  push:
    tags: ["v*"]

jobs:
  package:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build/native -G "Visual Studio 17 2022"
      - name: Build
        run: cmake --build build/native --config Release
      - name: Test
        run: ctest --test-dir build/native -C Release --output-on-failure
      - name: Assemble package
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File .\scripts\package.ps1 -OutputDirectory .\build\package
          Compress-Archive -Path .\build\package\* -DestinationPath QuickImageView-binary.zip -Force
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: QuickImageView-binary.zip
