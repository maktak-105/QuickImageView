name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish, for example v3.1.3
        required: true
        type: string

jobs:
  package:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Configure
        run: cmake -S . -B build/intermediate/native
      - name: Build
        run: cmake --build build/intermediate/native --config Release
      - name: Test
        run: ctest --test-dir build/intermediate/native -C Release --output-on-failure
      - name: Install WiX Toolset v3
        shell: pwsh
        run: choco install wixtoolset --version=3.14.1.20250415 --yes --no-progress
      - name: Assemble package
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File .\scripts\package.ps1 -OutputDirectory .\build\intermediate\package
          Compress-Archive -Path .\build\intermediate\package\* -DestinationPath QuickImageView-binary.zip -Force
      - name: Build MSI installer
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File .\installer\build-msi.ps1
      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $lines = @()
          foreach ($path in @('QuickImageView-binary.zip', 'dist/QuickImageView-3.1.3-x64.msi', 'dist/QuickImageView.exe')) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash.ToUpper()
            $lines += "$hash  $(Split-Path -Leaf $path)"
          }
          $lines | Set-Content -Path SHA256SUMS.txt -Encoding utf8NoBOM
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: |
            QuickImageView-binary.zip
            dist/QuickImageView-3.1.3-x64.msi
            SHA256SUMS.txt
