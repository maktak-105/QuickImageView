name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to update, for example v3.1.2-qt"
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.10.3
          arch: win64_msvc2022_64
          modules: qtimageformats qtshadertools
      - name: Configure
        run: cmake -S . -B build/ci -G "Visual Studio 17 2022" -DQt6_DIR="$env:Qt6_DIR" -DQUICKIMAGEVIEW_BUILD_QT=ON
      - name: Build
        run: cmake --build build/ci --config Release --target QuickImageView QuickImageViewQt qiv_controller_tests qiv_qml_tests
      - name: Test
        run: ctest --test-dir build/ci -C Release --output-on-failure
      - name: Deploy Qt runtime
        shell: pwsh
        run: |
          $env:PYTHONIOENCODING = "utf-8"
          python .\build-tools\deploy_qt.py
          if ($LASTEXITCODE -ne 0) { throw "Qt deploy failed" }
      - name: Assemble package
        shell: pwsh
        run: |
          $zip = Join-Path $env:GITHUB_WORKSPACE "QuickImageViewQt-v3.1.2-win64.zip"
          pwsh -NoProfile -ExecutionPolicy Bypass -File .\scripts\package.ps1 -Qt -OutputDirectory .\build\package-qt -ArchivePath $zip
          $required = @(
            ".\build\package-qt\QuickImageViewQt.exe",
            ".\build\package-qt\Qt6Core.dll",
            ".\build\package-qt\platforms\qwindows.dll",
            ".\build\package-qt\readme.txt",
            ".\build\package-qt\readme_jp.txt",
            ".\build\package-qt\LICENSE.txt"
          )
          foreach ($file in $required) {
            if (!(Test-Path -LiteralPath $file)) { throw "Missing distribution file: $file" }
          }
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: QuickImageViewQt-v3.1.2-win64.zip
          overwrite_files: true
          generate_release_notes: true
          body: |
            QuickImageView Qt Quick preview ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

            Built from the `qt` branch. Download `QuickImageViewQt-v3.1.2-win64.zip`, extract every file into the same folder, and run `QuickImageViewQt.exe`.

            Keep the executable, Qt DLLs, `platforms`, `imageformats`, and `qml` together. This ZIP does not include the Win32 MSI.
