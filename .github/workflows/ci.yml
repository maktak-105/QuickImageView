name: CI

on:
  push:
    branches: [main, qt]
  pull_request:
    branches: [main, qt]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.10.3
          arch: win64_msvc2022_64
          modules: qtimageformats qtshadertools
      - name: Configure
        run: cmake -S . -B build/ci -G "Visual Studio 17 2022" -DQt6_DIR="$env:Qt6_DIR" -DQUICKIMAGEVIEW_BUILD_QT=ON
      - name: Build
        run: cmake --build build/ci --config Release --target QuickImageView QuickImageViewQt qiv_controller_tests qiv_qml_tests
      - name: Test
        run: ctest --test-dir build/ci -C Release --output-on-failure
      - name: Install Cppcheck
        run: choco install cppcheck --no-progress --yes
      - name: Static analysis
        run: cppcheck --error-exitcode=1 --std=c++17 --enable=warning,style,performance,portability --suppress=missingIncludeSystem --suppress=unknownMacro core/native/qt_main.cpp core/native/qt_app_controller.cpp core/native/image_engine.cpp core/native/quick_image_provider.cpp
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: build/ci/Testing
          if-no-files-found: ignore
